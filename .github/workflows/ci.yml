name: portable-validation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [wasm-gc, wasm, js, native]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install official stable MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Record toolchain
        run: moon version --all
      - name: Verify public interfaces and formatting
        run: |
          moon info
          moon fmt --check
          git diff --exit-code -- '*.mbti'
      - name: Strict checks tests and build
        run: |
          moon check --deny-warn --target ${{ matrix.target }}
          moon test --deny-warn --target ${{ matrix.target }}
          moon build --deny-warn --target ${{ matrix.target }}
      - name: Public integration workflows
        run: |
          moon run examples/firmware --target ${{ matrix.target }}
          moon run examples/variants --target ${{ matrix.target }}
          moon run examples/ui --target ${{ matrix.target }}
          moon run examples/quickstart --target ${{ matrix.target }}
          moon run examples/declarations --target ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned independent differential oracle
        run: |
          python -m pip install kconfiglib==14.1.0
          python tools/differential.py --target ${{ matrix.target }}
          python tools/check_declarations.py --target ${{ matrix.target }}
      - name: Check out the fixed Linux v6.12 oracle and component inputs
        uses: actions/checkout@v4
        with:
          repository: torvalds/linux
          ref: adc218676eef25575469234709c2d87185ca223a
          path: _oracle/linux
          sparse-checkout: |
            scripts/kconfig
            scripts/include
            drivers/iio/temperature
            drivers/rtc
            drivers/usb/serial
            drivers/usb/typec/tcpm
            drivers/usb/typec/ucsi
            fs/notify/fanotify
            fs/notify/inotify
      - name: Build native Linux v6.12 oracle and compare exact configurations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq bison flex
          python tools/build_linux612.py --source _oracle/linux --output _oracle/build
          python tools/linux612.py --source _oracle/linux --conf _oracle/build/conf --target ${{ matrix.target }} --report _oracle/report-${{ matrix.target }}.json
      - name: Preserve native conformance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux612-${{ matrix.target }}
          path: _oracle/report-${{ matrix.target }}.json
      - name: Conservative source and meaningful history audit
        run: python tools/audit.py
